# drumkit.conf - Configuração do Drum Kit (Formato Padrão para Script)
# Formato: elemento = sample, midi_note, gain, pan
# Ganhos em dB (-inf a +inf), Pan em % (-100 esquerda, 0 centro, 100 direita)
# HiHats: 3 samples no mesmo slot com crossfade (closed=42, semi=44, open=46)

# ============================================
#  DRUMS
# ============================================

# Kick (bumbo) - 1 sample (pode usar 2 para attack + body)
kick = kick.wav, 36, 0dB, 0%

# Snare (caixa) - 1 sample (pode usar 2 para body + rim)
snare = snare.wav, 38, 0dB, 0%

# ============================================
#  HIHATS (3 samples no mesmo slot com crossfade)
# ============================================
# Fechado = nota 42 (F#2)
# Semi-aberto = nota 44 (A2)  
# Aberto = nota 46 (A#2)
# Quando um toca, os outros são silenciados (mutual_exclusion)

hihat_closed = hihat_closed.wav, 42, 0dB, 0%
hihat_half = hihat_half.wav, 44, 0dB, 0%
hihat_open = hihat_open.wav, 46, 0dB, 0%

# ============================================
#  TOMS
# ============================================

tom1 = tom1.wav, 41, -3dB, -30%
tom2 = tom2.wav, 43, -3dB, +30%
tom3 = tom3.wav, 45, -3dB, -10%

# ============================================
#  CRASH CYMBALS (pratos de ataque/crash)
# ============================================
# Pratos usados para ataque e crashes
# Geralmente 2-3 crashes são usados em baterias acústicas

crash1 = crash1.wav, 47, -2dB, -40%
crash2 = crash2.wav, 49, -2dB, +40%

# ============================================
#  RIDE CYMBAL
# ============================================
# Prato de ride para ritmo eefeitos

ride = ride.wav, 51, -2dB, 0%

# ============================================
#  SPLASH
# ============================================
# Prato splash para efeitos curtos

splash = splash.wav, 55, -2dB, 0%

# ============================================
#  OVERHEADS (stereo - 2 canais)
# ============================================
# Para stereo, use "stereo_L" e "stereo_R" como notas
# O script vai criar uma track estéreo automaticamente

overhead_L = overhead_l.wav, stereo_L, -4dB, -100%
overhead_R = overhead_r.wav, stereo_R, -4dB, +100%

# ============================================
#  ROOM MICS (stereo - 2 canais)
# ============================================
# Microfones de ambiente

room_L = room_l.wav, stereo_L, -6dB, -100%
room_R = room_r.wav, stereo_R, -6dB, +100%
